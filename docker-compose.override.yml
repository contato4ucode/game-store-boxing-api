version: '3.8'

services:
  gamestore-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5000"
      ASPNETCORE_HTTPS_PORTS: "5001"
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - gamestore-network
      
networks:
  gamestore-network:
    driver: bridge
