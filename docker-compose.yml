version: '3.8'

services:
  gamestore-api:
    image: gamestore-api
    container_name: gamestore.api
    build:
      context: .
      dockerfile: src/GameStore.API/Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:latest
    container_name: gamestore.database
    restart: always
    environment:
      POSTGRES_DB: game_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  redis:
    image: redis:latest
    container_name: gamestore.cache
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gamestore.messaging
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
      - "5672:5672"

volumes:
  postgres-data:
  redis-data:
